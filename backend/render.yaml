services:
  - type: web
    name: ner-logistics-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: sqlite:///./ner_logistics.db
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://nerlogistics.vercel.app"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
